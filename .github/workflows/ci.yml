# Continuous integration. Uses NO repository secrets and sends no code to any outside service.
# Enabling it is a deliberate step: this file does nothing until the project lives in a GitHub repository.
# Pin both actions to a full commit SHA when you add them (Dependabot, see dependabot.yml, will then keep the SHAs current).
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. Never switch this workflow to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Lifecycle scripts off: the only packages with install scripts are dev/optional (fsevents, unrs-resolver).
      # If eslint's resolver then complains about a missing native binary, drop the flag on this one step.
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest --forceExit
      # Production dependencies only; dev-tool advisories do not run in production and would only add noise.
      - run: npm audit --omit=dev --audit-level=high
      # Same checks the owner runs before a zip: no env files, keys, node_modules, .next, credentials or real-looking TFNs.
      - run: node scripts/package-release.cjs --check-only --profile source
