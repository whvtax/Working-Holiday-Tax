<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{ --forest:#0B5240; --forest2:#0E6B52; --gold:#E9A020; --cream:#F5F9F7; --ink:#12211C; --muted:#5C7169; --gstar:#FBBC04; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#333;font-family:'DM Sans',system-ui,sans-serif}
  .frame{ width:1080px; height:1920px; position:relative; overflow:hidden; }
  /* ambient brand ground */
  .bgGreen{ background:
      radial-gradient(1200px 900px at 50% -10%, #12694f 0%, rgba(18,105,79,0) 60%),
      radial-gradient(900px 700px at 90% 110%, #0d5f49 0%, rgba(13,95,73,0) 55%),
      linear-gradient(180deg,#0B5240 0%, #0a4a3a 100%); }
  .grain{ position:absolute; inset:0; opacity:.05; background-image:radial-gradient(#fff 1px, transparent 1px); background-size:6px 6px; pointer-events:none; }

  /* ---- review card frame ---- */
  .rvWrap{ position:absolute; inset:200px 80px 210px; display:flex; flex-direction:column; }
  .card{ flex:1; background:#fff; border-radius:48px; box-shadow:0 40px 90px rgba(0,0,0,.28); padding:74px 68px 64px; display:flex; flex-direction:column; }
  .gRow{ display:flex; align-items:center; gap:16px; margin-bottom:40px; }
  .gRow .gtxt{ font-size:30px; font-weight:600; color:#5f6b76; letter-spacing:.2px; }
  .who{ display:flex; align-items:center; gap:22px; margin-bottom:26px; }
  .ava{ position:relative; overflow:hidden; width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; flex-shrink:0; }
  .avaImg{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .name{ font-size:38px; font-weight:700; color:var(--ink); line-height:1.1; }
  .date{ font-size:27px; color:#94a29b; margin-top:6px; font-weight:500; }
  .body{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .stars{ display:flex; gap:8px; margin-bottom:34px; }
  .stars svg{ width:52px; height:52px; }
  .quote{ font-family:'Fraunces',Georgia,serif; color:#17332a; line-height:1.34; font-weight:600; letter-spacing:-.01em; }
  .footer{ margin-top:auto; padding-top:40px; display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand .mk{ width:52px;height:52px;flex-shrink:0 }
  .brand .bn{ font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:var(--forest); }
  .siteurl{ font-family:'DM Sans',sans-serif; font-size:27px; font-weight:700; color:var(--forest); letter-spacing:.2px; }
  .qmark{ font-family:'Fraunces',serif; font-size:120px; line-height:.6; color:#DCEDE6; height:70px; margin-bottom:6px; }

  /* headline (cover + cta) */
  .center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 110px; color:#fff; }
  .badge{ display:inline-flex; align-items:center; gap:16px; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.28); padding:20px 34px; border-radius:100px; margin-bottom:60px; }
  .badge .gtxt{ font-size:32px; font-weight:600; color:#fff; }
  .bigNum{ font-family:'Fraunces',serif; font-size:300px; font-weight:700; line-height:.9; color:#fff; letter-spacing:-.02em; }
  .coverStars{ display:flex; gap:14px; margin:26px 0 30px; }
  .coverStars svg{ width:80px; height:80px; }
  .h1{ font-family:'Fraunces',serif; font-size:76px; font-weight:700; line-height:1.12; margin-bottom:28px; letter-spacing:-.01em; }
  .sub{ font-size:36px; line-height:1.5; color:rgba(255,255,255,.82); font-weight:500; max-width:940px; }
  .logoBig{ display:flex; align-items:center; gap:20px; margin-bottom:54px; }
  .logoBig .mk{ width:70px; height:70px; }
  .logoBig .bn{ font-family:'Fraunces',serif; font-size:40px; font-weight:700; color:#fff; }
  .swipe{ position:absolute; left:0; right:0; bottom:250px; text-align:center; color:rgba(255,255,255,.7); font-size:30px; font-weight:600; letter-spacing:.4px; }
  .pill{ display:inline-flex; align-items:center; gap:14px; background:var(--gold); color:#1A2822; font-size:38px; font-weight:700; padding:30px 52px; border-radius:100px; margin-top:56px; box-shadow:0 20px 50px rgba(233,160,32,.4); }
  .handle{ position:absolute; left:0; right:0; bottom:250px; text-align:center; color:rgba(255,255,255,.85); font-size:34px; font-weight:700; }

  /* ---- reverse (green) pull-quote frame ---- */
  .gpad{ position:absolute; inset:230px 110px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff; }
  .gpad .bigq{ font-family:'Fraunces',serif; font-size:150px; line-height:.5; color:rgba(255,255,255,.18); height:80px; }
  .gstarsC{ display:flex; gap:14px; margin-bottom:44px; }
  .gstarsC svg{ width:62px; height:62px; }
  .gq{ font-family:'Fraunces',serif; font-weight:700; line-height:1.28; letter-spacing:-.01em; color:#fff; }
  .gname{ font-size:38px; font-weight:700; color:#EAF6F1; margin-top:56px; }
  .gsrc{ display:inline-flex; align-items:center; gap:12px; margin-top:16px; font-size:28px; color:rgba(255,255,255,.72); font-weight:600; }
  .gmkC{ position:absolute; left:0; right:0; bottom:200px; display:flex; align-items:center; justify-content:center; gap:14px; }
  .gmkC .mk{ width:52px; height:52px; flex-shrink:0; }
  .gmkC .bn{ font-family:'Fraunces',serif; font-size:28px; font-weight:700; color:rgba(255,255,255,.9); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const G = `<svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><path fill="#4285F4" d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"/><path fill="#34A853" d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"/><path fill="#FBBC04" d="M11.69 28.18c-.44-1.32-.69-2.73-.69-4.18s.25-2.86.69-4.18v-5.7H4.34C2.85 16.98 2 20.35 2 24s.85 7.02 2.34 9.88l7.35-5.7z"/><path fill="#EA4335" d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"/></svg>`;
const star = (s=52,c='#FBBC04')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg>`;
const mark = `<svg class="mk" viewBox="0 0 34 34" fill="none"><rect x="2" y="2" width="19" height="19" rx="4.5" stroke="#0B5240" stroke-width="2" opacity="0.9"/><rect x="13" y="13" width="19" height="19" rx="4.5" fill="#0B5240"/><path d="M22.5 17 L27 19 L27 23.5 Q27 27 22.5 29 Q18 27 18 23.5 L18 19 Z" fill="rgba(11,82,64,0.12)" stroke="#0B5240" stroke-width="1.2" stroke-linejoin="round"/><polyline points="20.4,23 22.2,25 25,21.5" fill="none" stroke="#0B5240" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const markW = mark.replace(/#0B5240/g,'#ffffff').replace('rgba(11,82,64,0.12)','rgba(255,255,255,0.12)');
// The exact brand mark from public/favicon.svg (gold accent line + dot, mint
// outer square, forest shield on a white tile) - designed for a green ground.
const markReal = `<svg class="mk" viewBox="0 0 34 34" fill="none"><rect x="2" y="2" width="19" height="19" rx="4.5" stroke="#5BB88A" stroke-width="2" fill="none"/><rect x="13" y="13" width="19" height="19" rx="4.5" fill="#ffffff"/><line x1="2" y1="2" x2="13" y2="13" stroke="#E9A020" stroke-width="1.4" stroke-linecap="round"/><circle cx="2" cy="2" r="1.8" fill="#E9A020"/><path d="M22.5 16.5 L27.3 18.7 L27.3 23.5 Q27.3 27.3 22.5 29.3 Q17.7 27.3 17.7 23.5 L17.7 18.7 Z" fill="rgba(11,82,64,0.12)" stroke="#0B5240" stroke-width="1.3" stroke-linejoin="round"/><polyline points="20.4,23 22.2,25 25,21.5" fill="none" stroke="#0B5240" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const AV=[['#B5D4F4','#0C447C'],['#9FE1CB','#085041'],['#F5C4B3','#712B13'],['#F4C0D1','#72243E'],['#FAC775','#633806'],['#CECBF6','#26215C']];

const reviews = [
 {n:'Henry Hazlem', d:'2026-08-28', t:"Quick and easy, great service. Won't be doing another return without them."},
 {n:'Louis Rafferty', d:'2026-08-21', t:"Very helpful throughout the whole process, made things super easy."},
 {n:'Hannah Porter', d:'2026-08-20', t:"The process was very smooth and straightforward. They were very helpful and efficient!"},
 {n:'Gina Vonkahlden', d:'2026-08-19', t:"Very recommendable! I'm from Germany so I had no idea how to do the tax return, but the team from Working Holiday Tax works super fast and responsibly!"},
 {n:'Kyosuke Ogawa', d:'2026-08-19', t:"I also had income from ABN work, so my tax return was a little complicated. I'm very satisfied with their service. Quick, professional and helpful throughout. I'll definitely use them again next year!"},
 {n:'Emily Bashford', d:'2026-08-18', t:"A really easy process! I was worried I wouldn't get any money back as I didn't have my Aus phone number anymore, but they made it work! Definitely recommend!"},
 {n:'Hana Kihara', d:'2026-08-12', t:"The process was very smooth and efficient, which put my mind at ease. Thank you very much!"},
 {n:'Niamh Bailey', d:'2026-08-12', t:"Highly recommend for anyone needing help with a Working Holiday Visa tax return! I made a mistake with last year's return and ended up paying a huge amount of tax. They helped me correct it and get a refund, as well as this year's return. So easy!"},
 {n:'Hollie Andrews', d:'2026-08-09', t:"Straightforward, speedy, and very good communication. All sorted for you, which takes off the stress when it's all new to you. Couldn't recommend it more!"},
 {n:'Rachel Smith', d:'2026-08-08', t:"Such an easy process and a great price too. I recommend it to everyone!!"},
 {n:'Connor Allison', d:'2026-08-08', t:"Highly recommend for all backpackers to get your tax done with these guys. They're fast and efficient with great communication!"},
 {n:'Aimee Chapman', d:'2026-08-07', t:"Such a smooth experience using these guys for my tax return. I'm on a working holiday visa and it saved me so much effort and time! Will definitely be using again."},
 {n:'Sasha Clarke', d:'2026-08-06', t:"Great experience with Working Holiday Tax! Made my tax return stress-free and easy!! Will use again next year."},
 {n:'Matthew Twyman', d:'2026-08-03', t:"Absolutely seamless from start to finish. I had no idea I was even due any tax back on a Working Holiday Visa, but they explained everything clearly and answered every question. Couldn't recommend them enough!"},
 {n:'Demi-Leigh Ayre', d:'2026-07-28', t:"Easy to use, very helpful and accommodating :)"},
 {n:'Julia Drengwitz', d:'2026-06-02', t:"Communication was via WhatsApp and I only had to fill out a Google Form. The tax refund arrived super fast. I have no idea about Australian taxes, and it was so easy! :)"},
 {n:'Verena Lindinger', d:'2026-05-18', t:"Straightforward and easy communication, everything worked very fast :)"},
 {n:'Olivia Metiwe', d:'2026-05-15', t:"Had no idea how Australian tax worked and they made it so easy. Everything was sorted quickly and the refund came through fast. Wish I'd found them sooner!"},
];

function relDate(iso){
  const d=new Date(iso), now=new Date('2026-08-30');
  const days=Math.round((now-d)/86400000);
  if(days<7) return days<=1?'a day ago':days+' days ago';
  if(days<30) return Math.round(days/7)+' weeks ago';
  if(days<365) return Math.round(days/30)+' months ago';
  return 'a year ago';
}
function initials(n){ return n.trim().charAt(0).toUpperCase(); }
function qSize(len){ return len<70?66: len<130?54: len<210?46: 40; }
function qSizeG(len){ return len<70?86: len<120?72: 60; }
// Short, punchy reviews read best as a big quote on green - spread across the set
// to break up the run of white cards (Jo, 30 Aug).
const GREEN = new Set([]);

// Real Google profile photos (same order as reviews). s256 for crisp retina.
const PH = [
 "https://lh3.googleusercontent.com/a-/ALV-UjV-qCQB1Bn9i3QhzVVsTRrnKAw3B4XsyLPQikEN-GqPPtFOFGOC=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocKKYz8nGfJ27_RqOmTqB-fwmsU_r9vNwEAz1Ag1xskzniWmxA=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocI3_Cr15FMPPTjT8yXu-LWXsg1AnVixfOJ0Xl11XCqsr15GDg=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocL2jG27MvZnplrgyWvAdi7HAFuGEm1-WF5hPo-tYFJ1bY-ccQ=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjVlc_WZXMVuyGRTCmznkgoEIUJ2fOQH5sgDNVEJDBVIEcO_gvOc=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjXK3uYuhAlijqG0fDuDcdvdAtIE9gYkeitOg8OVfksR6-UVO-TRnw=s256-c-rp-mo-ba12-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocJN6i8rvMOlmcYBqoTFsONsgmGFwDWWf9X6zNyQ-L-GzzVOtQ=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocKFOasNQ0dwClD4HVfsmFann6B0pkiOpv8Ttm-4PCn6m0Zpkw=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjUlpEEq2cg0Nab0YNPlYIy7B87BbRKJinFYTKVSGphR9ho2mVaK=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjV6n3tKCkQnDXUGWaETYe-YV4s2QmxXoxgfBVWs0gBAWXWSPWk=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocIF4fqKAFp1DT_aZZEF6Paj03OOss1GlKoqp_kgVxD1Ze3ryw=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocJeW29XUSy2gQFTk0OOoLfZLwY5WQoWYahAo3DRULDUhiesfg=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocL6NYnlB45lwN2HA8nbL3P6QUxZewhHv22BEHgBTqnXG7hE-w=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjU-DuPUMYr0bV52gB30h_WQQRCmf6weehNThpHgHFDB8wGS7jBE=s256-c-rp-mo-ba12-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocLSoxFDAyJiiN6XX647sD1QtGsp03Kwkj8eDI_SxirdrmbWBg=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocLDx3Ewvg7LCG80KPg9RfY9wn6NjVzwp0LcsAAdRFDcHM3HXg=s256-c-rp-mo-ba12-br100",
 "https://lh3.googleusercontent.com/a-/ALV-UjVpLAGUQ3L3j4UhAAu6OMxW3wwgw-mThmpXuQL7ZaZan7Dfm8g=s256-c-rp-mo-br100",
 "https://lh3.googleusercontent.com/a/ACg8ocIId34IhiofBHaksZCySLw_EWgz1i4eIR8IZ58_kjgjXIAJHg=s256-c-rp-mo-br100",
];

const stage=document.getElementById('stage');

// cover
stage.insertAdjacentHTML('beforeend', `
<div class="frame bgGreen" id="f-cover"><div class="grain"></div>
 <div class="center">
   <div class="logoBig">${markReal}<span class="bn">Working Holiday Tax</span></div>
   <div class="badge">${G.replace('34','40').replace('34','40')}<span class="gtxt">Google Reviews</span></div>
   <div class="bigNum">5.0</div>
   <div class="coverStars">${[0,1,2,3,4].map(()=>star(80)).join('')}</div>
   <div class="h1">What backpackers<br>say about us</div>
   <div class="sub">Five-star reviews from working holiday makers<br>who got their Australian tax sorted.</div>
 </div>
 <div class="swipe">Swipe to read them →</div>
</div>`);

// review frames
reviews.forEach((r,i)=>{
  const col=AV[i%AV.length];
  // reverse (green) pull-quote frame
  if(GREEN.has(i)){
    stage.insertAdjacentHTML('beforeend', `
    <div class="frame bgGreen" id="f-${i}"><div class="grain"></div>
      <div class="gpad">
        <div class="bigq">&ldquo;</div>
        <div class="gstarsC">${[0,1,2,3,4].map(()=>star(62)).join('')}</div>
        <div class="gq" style="font-size:${qSizeG(r.t.length)}px">${r.t}</div>
        <div class="gname">${r.n}</div>
        <div class="gsrc">${G}<span>Google review</span></div>
      </div>
      <div class="gmkC">${markW}<span class="bn">Working Holiday Tax</span></div>
    </div>`);
    return;
  }
  const q=qSize(r.t.length);
  stage.insertAdjacentHTML('beforeend', `
  <div class="frame bgGreen" id="f-${i}"><div class="grain"></div>
    <div class="rvWrap"><div class="card">
      <div class="qmark">&ldquo;</div>
      <div class="gRow">${G}<span class="gtxt">Google review</span></div>
      <div class="body">
        <div class="who">
          <div class="ava" style="background:${col[0]};color:${col[1]}">${initials(r.n)}${PH[i]?`<img class="avaImg" src="${PH[i]}" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
          <div><div class="name">${r.n}</div><div class="date">${relDate(r.d)}</div></div>
        </div>
        <div class="stars">${[0,1,2,3,4].map(()=>star(50)).join('')}</div>
        <div class="quote" style="font-size:${q}px">${r.t}</div>
      </div>
      <div class="footer">
        <div class="brand"><span class="siteurl">workingholidaytax.com.au</span></div>
      </div>
    </div></div>
  </div>`);
});

// closing CTA
stage.insertAdjacentHTML('beforeend', `
<div class="frame bgGreen" id="f-cta"><div class="grain"></div>
 <div class="center">
   <div class="logoBig">${markReal}<span class="bn">workingholidaytax.com.au</span></div>
   <div class="coverStars" style="margin-bottom:44px">${[0,1,2,3,4].map(()=>star(70)).join('')}</div>
   <div class="h1">Your turn to<br>get tax back</div>
   <div class="sub">Working holiday visa (417 &amp; 462). TFN, tax return, super &amp; ABN, all online.</div>
   <div class="pill">Start your tax return →</div>
 </div>
 <div class="handle">WhatsApp +61 424 513 998&nbsp;&nbsp;·&nbsp;&nbsp;@workingholidaytax</div>
</div>`);
</script>
</body>
</html>
